name: run-tutorials
on:
  push:
    branches: [book-tutorials]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install openseespy numpy matplotlib
      - name: run chapters
        run: |
          cd tutorial
          for d in ch*/; do
            s=$(ls $d*.py | head -1)
            echo "=== $s"
            ( cd $d && timeout 900 python $(basename $s) > run.log 2>&1; echo "EXIT $?" >> run.log )
            tail -25 $d/run.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-results
          path: |
            tutorial/ch*/figs/
            tutorial/ch*/run.log
